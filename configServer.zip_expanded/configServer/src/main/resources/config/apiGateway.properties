server.port=8080

# Eureka Client

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true


# Doctor Service

spring.cloud.gateway.server.webmvc.routes[0].id=doctor-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://DoctorService
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/doctor/**


# Patient Service

spring.cloud.gateway.server.webmvc.routes[1].id=patient-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://PatientService
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/patient/**


# Appointment Service

spring.cloud.gateway.server.webmvc.routes[2].id=appointment-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://AppointmentService
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/appointment/**